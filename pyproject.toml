[project]
name = "depthchart"
version = "0.1.0"
description = "Chat servers and channels for fantasy football leagues"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.101",
    "email-validator>=2.3.0",
    "faker>=40.39.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-socketio>=5.6.1",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "simple-websocket>=1.1.0",
    "sqlalchemy>=2.0.54",
    "werkzeug>=3.1.8",
    "wtforms>=3.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
